name: Windows Job isolation proof
on:
  push:
    branches: [test/pi-windows-job-proof]
permissions:
  contents: read
jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile Node-API proof on Node 22
        run: npm exec --yes --package=node-gyp@13.0.2 -- node-gyp rebuild --directory probe
      - name: Pack and install without build scripts
        run: |
          npm pack ./probe --ignore-scripts --pack-destination "$env:RUNNER_TEMP"
          npm install --prefix "$env:RUNNER_TEMP/proof-install" --ignore-scripts --omit=dev "$env:RUNNER_TEMP/pi-windows-job-proof-0.0.0.tgz"
          "PROOF_MODULE=$env:RUNNER_TEMP/proof-install/node_modules/pi-windows-job-proof/index.cjs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Kernel ancestry checks on Node 22
        run: node probe/verify.cjs
      - run: pnpm build
      - name: Official Pi native smoke with Job-owned adapter
        run: pnpm smoke
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Same installed binary on Node 24 without rebuilding
        run: node probe/verify.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-job-proof
          path: ${{ runner.temp }}/pi-windows-job-proof-0.0.0.tgz
