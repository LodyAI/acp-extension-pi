name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm smoke
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pi-package"
      - run: npm install --prefix "$RUNNER_TEMP/pi-install" --omit=dev "$RUNNER_TEMP"/pi-package/*.tgz
      - run: node scripts/smoke.mjs "$RUNNER_TEMP/pi-install/node_modules/acp-extension-pi/dist/index.js"
