name: Publish and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Existing stable release tag to retry (vX.Y.Z)
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release-please:
    if: github.repository == 'LodyAI/acp-extension-pi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        if: github.event_name == 'push'
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate the released commit
        if: steps.release.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name || inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -qx true
          sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          git show "$sha:package.json" > "$RUNNER_TEMP/release-package.json"
          node -e 'const p = require(process.env.RUNNER_TEMP + "/release-package.json"); if (p.name !== "acp-extension-pi" || "v" + p.version !== process.env.RELEASE_TAG || p.private) process.exit(1)'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  windows-native:
    needs: release-please
    if: needs.release-please.outputs.sha != ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - run: pnpm build
      - run: pnpm smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-native-${{ runner.arch }}
          path: native/*.node
          if-no-files-found: error

  publish-npm:
    needs: [release-please, windows-native]
    if: needs.release-please.outputs.sha != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm smoke
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-native-*
          path: native
          merge-multiple: true
      - name: Require both Windows architectures
        run: pnpm prepublishOnly
      - run: pnpm pack --pack-destination "$RUNNER_TEMP/pi-package"
      - run: npm install --prefix "$RUNNER_TEMP/pi-install" --ignore-scripts --omit=dev "$RUNNER_TEMP"/pi-package/*.tgz
      - run: node scripts/smoke.mjs "$RUNNER_TEMP/pi-install/node_modules/acp-extension-pi/dist/index.js"
      - run: npm publish "$RUNNER_TEMP"/pi-package/*.tgz --access public --provenance
